<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글로벌 결제 · Stargate Edu Shop</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#0B2A4A;--gold:#C9A227;--ink:#1A2233;--gray:#667085;--line:#E4E7EC;--bg:#F7F9FC}*{box-sizing:border-box}body{margin:0;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}.wrap{max-width:760px;margin:auto;padding:0 20px}.top{height:64px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;color:var(--navy);text-decoration:none}.logo b{color:var(--gold)}.back{font-size:13px;color:var(--gray);text-decoration:none}main{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;margin:34px 0 60px;box-shadow:0 16px 40px rgba(11,42,74,.08)}.kicker{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.5px;text-transform:uppercase}h1{font-size:28px;color:var(--navy);line-height:1.3;margin:8px 0}.summary{color:var(--gray)}.price{font-size:30px;font-weight:800;color:var(--navy);padding:18px 0;border-bottom:1px solid var(--line)}h2{font-size:16px;color:var(--navy);margin-top:24px}ul{padding-left:22px;color:#475467}.related{display:flex;gap:8px;flex-wrap:wrap}.related a{font-size:13px;background:#EEF3F8;color:var(--navy);border-radius:999px;padding:7px 12px;text-decoration:none}.notice{background:#FFF8E1;border:1px solid #F0D77A;border-radius:12px;padding:14px 16px;color:#5B4A12;font-size:14px;margin-top:24px}.pay{display:block;text-align:center;margin-top:18px;background:var(--gold);color:#302600;border-radius:10px;padding:14px 20px;font-weight:800;text-decoration:none}.pay.disabled{background:#D0D5DD;color:#667085;cursor:not-allowed}.support{display:block;text-align:center;color:var(--navy);font-size:13px;margin-top:12px}.trust-note{font-size:12px;color:var(--gray);text-align:center;margin-top:18px}@media(max-width:560px){main{margin-top:18px;padding:24px}h1{font-size:23px}}
</style></head>
<body><div class="wrap"><div class="top"><a class="logo" id="home-link" href="/">STARGATE<b>EDU</b></a><a class="back" id="back-link" href="/">← 상품으로 돌아가기</a></div><main id="checkout"><p id="loading">상품 정보를 확인하고 있습니다.</p></main></div>
<script src="/catalog.js?v=20260720"></script><script src="/payment-links.js?v=20260720"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const sku = params.get("sku");
  const lang = params.get("lang") === "en" ? "en" : "ko";
  const catalog = window.STARGATE_CATALOG;
  const payments = window.STARGATE_PAYMENTS;
  const translations = catalog.i18n?.[lang] || {};
  const entry = Object.entries(catalog.products).find(([, item]) => item.sku === sku);
  const root = document.getElementById("checkout");
  const copy = lang === "en" ? {
    back: "← Return to products", loading: "Checking product information.",
    missing: "Product not found", retry: "Please select the product again.",
    list: "View products", included: "What’s included", related: "Related courses & books",
    pay: "Pay securely with", waitTitle: "Payment link pending",
    wait: "The product, pricing, and content mapping are ready. Checkout activates automatically when the PayPal Business link is registered.",
    preparing: "Global checkout coming soon", support: "Payment support for this product",
    trust: "Payment details are processed on the payment provider’s secure page and are never stored by Stargate Edu.",
    month: "month", year: "year"
  } : {
    back: "← 상품으로 돌아가기", loading: "상품 정보를 확인하고 있습니다.",
    missing: "상품을 찾을 수 없습니다", retry: "상품 목록에서 다시 선택해 주세요.",
    list: "상품 목록 보기", included: "포함 콘텐츠", related: "연결된 강의·교재",
    pay: "안전하게 결제", waitTitle: "결제 링크 연결 대기",
    wait: "상품·금액·연계 콘텐츠 구성은 완료되었으며 PayPal Business 링크가 등록되면 자동 활성화됩니다.",
    preparing: "글로벌 결제 준비 중", support: "이 상품 결제 문의",
    trust: "결제 정보는 Stargate Edu 서버에 저장하지 않고 결제 플랫폼의 보안 화면에서 처리합니다.",
    month: "월", year: "년"
  };
  const shopUrl = lang === "en" ? "/en.html" : "/";
  document.documentElement.lang = lang;
  document.title = (lang === "en" ? "Global Checkout" : "글로벌 결제") + " · Stargate Edu Shop";
  document.getElementById("home-link").href = shopUrl;
  document.getElementById("back-link").href = shopUrl;
  document.getElementById("back-link").textContent = copy.back;
  document.getElementById("loading").textContent = copy.loading;

  if (!entry) {
    root.innerHTML = `<h1>${copy.missing}</h1><p class="summary">${copy.retry}</p><a class="pay" href="${shopUrl}">${copy.list}</a>`;
    return;
  }

  const [id, source] = entry;
  const item = { ...source, ...(translations[id] || {}) };
  const money = new Intl.NumberFormat(lang === "en" ? "en-US" : "ko-KR", {
    style: "currency", currency: catalog.currency, maximumFractionDigits: 0
  });
  const paymentUrl = payments.links[item.sku];
  let safePaymentUrl = "";
  try {
    const parsed = new URL(paymentUrl);
    if (parsed.protocol === "https:") safePaymentUrl = parsed.href;
  } catch (error) {}
  const related = (item.related || []).map((relatedId) => {
    const relatedSource = catalog.products[relatedId];
    if (!relatedSource) return "";
    const relatedItem = { ...relatedSource, ...(translations[relatedId] || {}) };
    return `<a href="${shopUrl}#${relatedId}">${relatedItem.name}</a>`;
  }).join("");
  const subject = encodeURIComponent(`[${item.sku}] ${item.name} ${lang === "en" ? "payment inquiry" : "결제 문의"}`);
  const interval = item.interval ? ` / ${item.interval === "month" ? copy.month : copy.year}` : "";
  root.innerHTML = `<div class="kicker">${payments.provider} Global Checkout · ${item.sku}</div><h1>${item.name}</h1><p class="summary">${item.summary}</p><div class="price">${money.format(item.amount)}${interval}</div><h2>${copy.included}</h2><ul>${item.contents.map((content) => `<li>${content}</li>`).join("")}</ul>${related ? `<h2>${copy.related}</h2><div class="related">${related}</div>` : ""}${safePaymentUrl ? `<a class="pay" href="${safePaymentUrl}" rel="noopener">${copy.pay} ${payments.provider}</a>` : `<div class="notice"><b>${copy.waitTitle}</b><br>${copy.wait}</div><span class="pay disabled" aria-disabled="true">${copy.preparing}</span>`}<a class="support" href="mailto:${payments.supportEmail}?subject=${subject}">${copy.support}</a><p class="trust-note">${copy.trust}</p>`;
})();
</script></body></html>
